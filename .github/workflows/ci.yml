name: CI

on:
  push:
    branches:
      - main
      - develop
      - stabilize
  pull_request:
    branches:
      - main
      - develop
      - stabilize

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Bundle analysis
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/stabilize'
        run: npm run analyze
        env:
          ANALYZE: "true"

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000