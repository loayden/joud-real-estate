services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: joud_dev
      POSTGRES_USER: joud
      POSTGRES_PASSWORD: joud_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  postgres_data: {}
